        chain.then(function () {
          var ptr = 0;
          var outLines = lineRecords.map(function (rec) {
            if (rec.type === "skip") return rec.raw;
            var id = String(ptr);
            ptr++;
            var translatedText = resultMap[id] !== undefined ? resultMap[id] : rec.text;
            return rebuildLine(rec, translatedText);
          });
          setOutputContent(outLines.join("\n"));
          setStatus("done");
        }).catch(function (err) {
          console.error(err);
          setErrorMsg("No se pudo completar la traducción: " + err.message);
          setStatus("error");
        });
      } catch (err) {
        console.error(err);
        setErrorMsg("No se pudo completar la traducción: " + err.message);
        setStatus("error");
      }
    }

    function handleCopy() {
      if (!outputContent) return;
      navigator.clipboard.writeText(outputContent).then(function () {
        setCopied(true);
        setTimeout(function () { setCopied(false); }, 1800);
      });
    }

    function handleDownload() {
      if (!outputContent) return;
      var blob = new Blob([outputContent], { type: "text/yaml" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var base = fileName ? fileName.replace(/\.ya?ml$/i, "") : "config";
      a.href = url;
      a.download = base + "_" + targetLang + ".yml";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    var lineCount = activeContent ? activeContent.split(/\r\n|\n/).length : 0;

    return h("div", null,
      h("div", { className: "topbar" },
        h("div", { className: "wrap topbar-inner" },
          h("div", { className: "brand" },
            h("div", { className: "brand-icon" }, h(IconFile, { width: 16, height: 16, strokeWidth: "2.5" })),
            h("span", { className: "brand-name" }, "YML Translate")
          ),
          h("div", { className: "brand-tag mono" }, "Paper · Bukkit · Spigot")
        )
      ),
      h("div", { className: "wrap", style: { paddingTop: 32, paddingBottom: 32 } },
        h("div", { style: { marginBottom: 32 } },
          h("h1", null, "Traductor de YML"),
          h("p", { className: "lead" }, "Traduce archivos de configuración respetando claves, rutas, materiales y placeholders. Sube un archivo o pega el texto, elige el idioma y descarga el resultado.")
        ),

        h("div", { className: "card" },
          h("div", { className: "apikey-label" },
            h(IconKey, { width: 15, height: 15, style: { color: "#6B7078" } }),
            h("span", null, "API Key de Anthropic")
          ),
          h("input", {
            type: "password",
            className: "input mono",
            placeholder: "sk-ant-...",
            value: apiKey,
            onChange: function (e) { setApiKey(e.target.value); }
          }),
          h("p", { className: "hint" }, "Este archivo funciona de forma independiente y llama directamente a la API de Anthropic desde tu navegador, por eso necesita tu propia key (console.anthropic.com). No se guarda ni se envía a ningún servidor propio.")
        ),

        h("div", { className: "tabs" },
          h("button", {
            className: "tab" + (mode === "upload" ? " active" : ""),
            onClick: function () { setMode("upload"); }
          }, h(IconUpload, { width: 16, height: 16 }), "Subir archivo"),
          h("button", {
            className: "tab" + (mode === "paste" ? " active" : ""),
            onClick: function () { setMode("paste"); }
          }, h(IconFile, { width: 16, height: 16 }), "Pegar texto")
        ),

        h("div", { className: "card" },
          mode === "upload"
            ? h(Fragment, null,
                h("div", { className: "row-between" },
                  h("span", { className: "card-title" }, "Archivo"),
                  fileName && h("button", {
                    className: "x-btn",
                    onClick: function () { setRawContent(""); setFileName(""); setOutputContent(""); setStatus("idle"); }
                  }, h(IconX, { width: 16, height: 16 }))
                ),
                h("input", {
                  ref: fileInputRef,
                  type: "file",
                  accept: ".yml,.yaml,text/yaml,text/plain",
                  style: { display: "none" },
                  onChange: function (e) { handleFile(e.target.files && e.target.files[0]); }
                }),
                h("div", {
                  className: "dropzone" + (dragOver ? " drag" : ""),
                  onClick: function () { fileInputRef.current && fileInputRef.current.click(); },
                  onDragOver: function (e) { e.preventDefault(); setDragOver(true); },
                  onDragLeave: function () { setDragOver(false); },
                  onDrop: onDrop
                },
                  fileName
                    ? h("div", null,
                        h("div", { className: "dz-icon" }, h(IconFile, { width: 18, height: 18, style: { color: "#7EE3F7" } })),
                        h("p", { className: "mono", style: { fontSize: 13, color: "#E7E9EC", margin: "0 0 4px" } }, fileName),
                        h("p", { style: { fontSize: 12, color: "#6B7078", margin: 0 } }, lineCount + " líneas · toca para cambiar")
                      )
                    : h("div", null,
                        h("div", { className: "dz-icon" }, h(IconUpload, { width: 18, height: 18, style: { color: "#6B7078" } })),
                        h("p", { style: { fontSize: 14, color: "#9296A0", margin: "0 0 4px" } }, "Arrastra tu archivo .yml aquí o toca para elegirlo"),
                        h("p", { style: { fontSize: 12, color: "#5A5F67", margin: 0 } }, "config.yml, messages.yml, lang/es.yml...")
                      )
                )
              )
            : h(Fragment, null,
                h("div", { className: "row-between" },
                  h("span", { className: "card-title" }, "Contenido YML"),
                  pastedText && h("button", {
                    className: "x-btn",
                    onClick: function () { setPastedText(""); setOutputContent(""); setStatus("idle"); }
                  }, h(IconX, { width: 16, height: 16 }))
                ),
                h("textarea", {
                  className: "ta mono",
                  spellCheck: false,
                  placeholder: "welcome-message: '&aBienvenido %player%!'\nitem-name: '&6Espada Legendaria'\nmaterial: DIAMOND_SWORD",
                  value: pastedText,
                  onChange: function (e) { setPastedText(e.target.value); setOutputContent(""); setStatus("idle"); }
                }),
                h("p", { style: { fontSize: 12, color: "#5A5F67", marginTop: 8 } },
                  pastedText ? (pastedText.split(/\r\n|\n/).length + " líneas") : "Pega el contenido de tu archivo YML"
                )
              )
        ),

        h("div", { className: "card" },
          h("span", { className: "card-title", style: { display: "block", marginBottom: 12 } }, "Idioma de destino"),
          h("div", { className: "select-wrap" },
            h("button", {
              className: "select-btn",
              onClick: function () { setLangOpen(!langOpen); }
            },
              h("span", null, langLabel),
              h(IconChevron, { width: 16, height: 16, style: { color: "#6B7078", transition: "transform .15s", transform: langOpen ? "rotate(180deg)" : "none" } })
            ),
            langOpen && h("div", { className: "select-menu" },
              LANGS.map(function (l) {
                return h("button", {
                  key: l.code,
                  className: "select-opt" + (l.code === targetLang ? " selected" : ""),
                  onClick: function () { setTargetLang(l.code); setLangOpen(false); }
                }, l.label);
              })
            )
          )
        ),

        h("button", {
          className: "btn-main",
          disabled: !activeContent || !activeContent.trim() || status === "translating",
          onClick: runTranslation
        },
          status === "translating"
            ? h(Fragment, null, h(IconLoader, { width: 18, height: 18, className: "spin" }), "Traduciendo " + progress.done + "/" + progress.total + "...")
            : h(Fragment, null, "Traducir archivo ", h(IconArrowRight, { width: 16, height: 16 }))
        ),

        status === "translating" && progress.total > 0 && h("div", { className: "progress-wrap" },
          h("div", { className: "progress-track" },
            h("div", { className: "progress-fill", style: { width: Math.max(6, (progress.done / progress.total) * 100) + "%" } })
          )
        ),

        status === "error" && h("div", { className: "error-box" }, errorMsg),

        outputContent && h("div", { className: "card" },
          h("div", { className: "row-between" },
            h("div", null,
              h("span", { className: "card-title", style: { display: "block" } }, "Resultado"),
              h("span", { className: "card-sub" }, "Traducido a " + langLabel)
            ),
            h("div", { className: "out-actions" },
              h("button", { className: "btn-ghost", onClick: handleCopy },
                copied ? h(IconCheck, { width: 14, height: 14, style: { color: "#7EE3F7" } }) : h(IconCopy, { width: 14, height: 14 }),
                copied ? "Copiado" : "Copiar"
              ),
              h("button", { className: "btn-solid", onClick: handleDownload },
                h(IconDownload, { width: 14, height: 14 }), "Descargar"
              )
            )
          ),
          h("pre", { className: "out mono" }, outputContent)
        ),

        h("p", { className: "footnote" }, "Las claves, rutas, materiales, IDs de Minecraft y placeholders (%player%, {value}, &a, etiquetas MiniMessage) no se traducen y se preservan exactamente igual.")
      )
    );
  }

  var root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(h(App));
})();
</script>
</body>
</html>
