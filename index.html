<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YML Translate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0B0D10; }
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; color: #E7E9EC; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2A2E35; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  @keyframes pulseBar { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }
  a { color: inherit; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  .topbar { border-bottom: 1px solid #1C1F24; background: #0E1013; }
  .topbar-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg,#54DAF4,#545EB6); display:flex; align-items:center; justify-content:center; color:#0B0D10; }
  .brand-name { font-weight: 600; letter-spacing: -0.01em; font-size: 15px; }
  .brand-tag { font-size: 12px; color: #6B7078; }

  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 8px; }
  .lead { color: #9296A0; font-size: 15px; line-height: 1.6; margin: 0; }

  .card { border-radius: 16px; border: 1px solid #22262C; background: #111318; padding: 20px; margin-bottom: 16px; }
  .card-title { font-weight: 600; font-size: 15px; margin: 0; }
  .card-sub { font-size: 12px; color: #6B7078; margin: 2px 0 0; }
  .row-between { display:flex; align-items:center; justify-content:space-between; margin-bottom: 12px; }

  .apikey-label { display:flex; align-items:center; gap:8px; margin-bottom: 12px; }
  .apikey-label span { font-weight:600; font-size:14px; }
  .input { width: 100%; border-radius: 12px; background: #0B0D10; border: 1px solid #22262C; padding: 10px 14px; font-size: 13px; color: #D6D9DE; outline: none; }
  .input:focus { border-color: rgba(84,218,244,0.5); }
  .hint { font-size: 11px; color: #5A5F67; margin: 8px 0 0; line-height: 1.5; }
  .btn-icon { display:flex; align-items:center; justify-content:center; width: 40px; border-radius: 10px; border: 1px solid #22262C; background: #0B0D10; color: #7EE3F7; flex-shrink: 0; }
  .btn-icon:hover { border-color: #54DAF4; }
  .btn-icon-sm { display:flex; align-items:center; justify-content:center; width: 24px; height: 24px; border-radius: 6px; border: none; background: transparent; color: #6B7078; flex-shrink: 0; }
  .btn-icon-sm:hover { color: #FF8A8A; }
  .glossary-list { max-height: 200px; overflow-y: auto; border-radius: 10px; border: 1px solid #1C1F24; }
  .glossary-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 12.5px; border-bottom: 1px solid #1C1F24; }
  .glossary-row:last-child { border-bottom: none; }
  .glossary-src { color: #9296A0; flex: 1 1 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .glossary-arrow { color: #4A4F57; flex-shrink: 0; }
  .glossary-dst { color: #D6D9DE; flex: 1 1 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats-row { display:flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 0; font-size: 12px; color: #9296A0; }
  .stats-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { flex: 1; display:flex; align-items:center; justify-content:center; gap:8px; border-radius: 12px; border: 1px solid #22262C; background: #111318; color: #9296A0; padding: 12px 16px; font-size: 14px; font-weight: 500; transition: border-color .15s, background .15s, color .15s; }
  .tab.active { border-color: rgba(84,218,244,0.5); background: rgba(84,218,244,0.1); color: #7EE3F7; }
  .tab:not(.active):hover { border-color: #2E333A; }

  .dropzone { border-radius: 12px; border: 2px dashed #2A2E35; padding: 40px 24px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  .dropzone.drag { border-color: #54DAF4; background: rgba(84,218,244,0.05); }
  .dropzone:not(.drag):hover { border-color: #3A3F47; }
  .dz-icon { width: 40px; height: 40px; margin: 0 auto 12px; border-radius: 10px; background: #1B1E24; display:flex; align-items:center; justify-content:center; }

  textarea.ta { width: 100%; height: 190px; border-radius: 12px; background: #0B0D10; border: 1px solid #22262C; padding: 12px 16px; font-size: 13px; color: #D6D9DE; outline: none; resize: none; }
  textarea.ta:focus { border-color: rgba(84,218,244,0.5); }
  textarea.ta::placeholder { color: #4A4F57; }

  .select-btn { width: 100%; display:flex; align-items:center; justify-content:space-between; border-radius: 12px; border: 1px solid #22262C; background: #0B0D10; padding: 12px 16px; font-size: 14px; color: #E7E9EC; }
  .select-btn:hover { border-color: #2E333A; }
  .select-wrap { position: relative; }
  .select-menu { position: absolute; z-index: 10; margin-top: 6px; width: 100%; border-radius: 12px; border: 1px solid #22262C; background: #15171C; box-shadow: 0 12px 32px rgba(0,0,0,.4); overflow: hidden; }
  .select-opt { display:block; width: 100%; text-align: left; padding: 10px 16px; font-size: 14px; background: none; border: none; color: #D6D9DE; }
  .select-opt:hover { background: #1C1F24; }
  .select-opt.selected { color: #7EE3F7; }

  .btn-main { width: 100%; display:flex; align-items:center; justify-content:center; gap: 8px; border-radius: 12px; border: none; background: linear-gradient(90deg,#54DAF4,#545EB6); color: #0B0D10; font-weight: 600; font-size: 15px; padding: 14px; margin-bottom: 24px; transition: opacity .15s; }
  .btn-main:disabled { opacity: .3; cursor: not-allowed; }
  .btn-main:not(:disabled):hover { opacity: .9; }

  .progress-wrap { margin: -16px 0 24px; }
  .progress-track { height: 6px; border-radius: 999px; background: #1C1F24; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg,#54DAF4,#545EB6); animation: pulseBar 1.4s ease-in-out infinite; transition: width .3s ease; }

  .error-box { margin-bottom: 24px; border-radius: 12px; border: 1px solid rgba(244,91,91,0.3); background: rgba(244,91,91,0.1); padding: 12px 16px; font-size: 13px; color: #FF8A8A; }

  .out-actions { display: flex; gap: 8px; }
  .btn-ghost { display:flex; align-items:center; gap:6px; border-radius: 8px; border: 1px solid #22262C; background: #0B0D10; color: #D6D9DE; padding: 8px 12px; font-size: 13px; }
  .btn-ghost:hover { border-color: #2E333A; }
  .btn-solid { display:flex; align-items:center; gap:6px; border-radius: 8px; border:none; background: linear-gradient(90deg,#54DAF4,#545EB6); color: #0B0D10; font-weight: 600; padding: 8px 12px; font-size: 13px; }
  .btn-solid:hover { opacity: .9; }

  pre.out { border-radius: 12px; background: #0B0D10; border: 1px solid #22262C; padding: 12px 16px; font-size: 12.5px; color: #D6D9DE; overflow: auto; max-height: 380px; white-space: pre-wrap; word-break: break-word; margin: 0; }

  .footnote { font-size: 11px; color: #4A4F57; text-align: center; margin-top: 32px; line-height: 1.6; }

  .x-btn { background: none; border: none; color: #6B7078; padding: 4px; display:flex; }
  .x-btn:hover { color: #E7E9EC; }

  @media (max-width: 480px) {
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div id="root">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#6B7078;font-size:14px;">
    Cargando…
  </div>
</div>

<script>
  window.addEventListener('error', function (e) {
    var root = document.getElementById('root');
    if (root && root.innerHTML.indexOf('Cargando') !== -1) {
      root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#FF8A8A;font-size:14px;max-width:480px;margin:0 auto;">No se pudo iniciar la página.<br><br>Detalle: ' + (e.message || 'error desconocido') + '<br><br>Prueba abrirla desde un navegador de escritorio o subirla a un hosting (GitHub Pages, Netlify, etc.) en vez de abrir el archivo directamente.</div>';
    }
  }, true);
</script>

<script>
(function () {
  var h = React.createElement;
  var useState = React.useState;
  var useRef = React.useRef;
  var useCallback = React.useCallback;
  var Fragment = React.Fragment;

  var LANGS = [
    { code: "en", label: "Inglés" },
    { code: "es", label: "Español" },
    { code: "pt", label: "Portugués" },
    { code: "fr", label: "Francés" },
    { code: "de", label: "Alemán" },
    { code: "it", label: "Italiano" },
    { code: "ru", label: "Ruso" },
    { code: "zh", label: "Chino" },
  ];

  var PLACEHOLDER_PATTERNS = [
    /%[a-zA-Z0-9_\-]+%/g,
    /\{\{[a-zA-Z0-9_\-]+\}\}/g,
    /\{[a-zA-Z0-9_\-]+\}/g,
    /&[0-9a-fk-orA-FK-OR]/g,
    /§[0-9a-fk-orA-FK-OR]/g,
    /<[a-zA-Z0-9_#:\/=,. \-]+>/g,
    /minecraft:[a-z0-9_.]+/g,
    /\b[A-Z][A-Z0-9_]{2,}\b/g,
    /%%/g,
  ];

  function splitKeyValue(line) {
    var m = line.match(/^(\s*)(-\s+)?([^:#][^:]*?)(:)(\s*)(.*)$/);
    if (!m) return null;
    return { indent: m[1], dash: m[2] || "", key: m[3], colon: m[4], sp: m[5], rest: m[6] };
  }

  function extractInlineComment(value) {
    var inQuote = null;
    for (var i = 0; i < value.length; i++) {
      var c = value[i];
      if (inQuote) {
        if (c === inQuote) inQuote = null;
      } else if (c === '"' || c === "'") {
        inQuote = c;
      } else if (c === "#" && (i === 0 || value[i - 1] === " ")) {
        return { val: value.slice(0, i).replace(/\s+$/, ""), comment: value.slice(i) };
      }
    }
    return { val: value, comment: "" };
  }

  function stripQuotes(v) {
    var trimmed = v.trim();
    if ((trimmed[0] === '"' && trimmed[trimmed.length - 1] === '"') ||
        (trimmed[0] === "'" && trimmed[trimmed.length - 1] === "'")) {
      return { quote: trimmed[0], text: trimmed.slice(1, -1) };
    }
    return { quote: "", text: trimmed };
  }

  // Claves que casi siempre contienen texto para el jugador (aunque el valor sea una sola palabra)
  var TEXT_KEY_HINTS = /(message|msg|text|lore|name|title|desc|description|prefix|suffix|reason|tooltip|hover|label|tip|hint|error|success|warning|info|notice|announce|broadcast|greeting|farewell|welcome|goodbye|question|prompt|subtitle|actionbar|action-bar|bossbar|boss-bar)/i;

  // Claves que casi siempre son técnicas, aunque el valor "parezca" texto
  var TECHNICAL_KEY_HINTS = /^(material|item|type|sound|particle|effect|permission|perm|command|cmd|world|region|id|uuid|path|file|color|colour|action|mode|format|encoding|url|link|icon|texture|model|namespace)$/i;

  function parseLines(content) {
    var lines = content.split(/\r\n|\n/);
    return lines.map(function (raw, idx) {
      if (/^\s*#/.test(raw) || raw.trim() === "") return { idx: idx, raw: raw, type: "skip" };
      var kv = splitKeyValue(raw);
      if (!kv) return { idx: idx, raw: raw, type: "skip" };
      var indent = kv.indent, dash = kv.dash, key = kv.key, sp = kv.sp, rest = kv.rest;

      var restTrim = rest.trim();
      if (restTrim === "" || restTrim === "|" || restTrim === ">" || restTrim === "|-" || restTrim === ">-") {
        return { idx: idx, raw: raw, type: "skip" };
      }

      var ic = extractInlineComment(rest);
      var sq = stripQuotes(ic.val);
      var text = sq.text, quote = sq.quote, comment = ic.comment;

      // Nunca traducibles bajo ninguna circunstancia: vacío, booleano, número, lista/mapa inline, constante MAYÚSCULA, id namespaced
      var neverTranslatable =
        text === "" ||
        /^(true|false|null|yes|no)$/i.test(text) ||
        /^-?\d+(\.\d+)?$/.test(text) ||
        /^\[.*\]$/.test(text) ||
        /^\{.*\}$/.test(text) ||
        /^[A-Z0-9_]{2,}$/.test(text) ||          // MATERIAL_NAME / CONSTANT (2+ chars, evita falsos positivos de una letra)
        /^minecraft:[a-z0-9_.]+$/.test(text) ||
        /^#[0-9a-fA-F]{3,8}$/.test(text) ||       // color hex suelto
        /^[a-z0-9_]+(\.[a-z0-9_]+)+$/.test(text); // rutas tipo plugin.permission.node o config.path.key

      if (neverTranslatable) {
        return { idx: idx, raw: raw, type: "skip" };
      }

      var normalizedKey = key.trim();
      var hasLetters = /[a-zA-ZÀ-ÿ]/.test(text);

      if (!hasLetters) {
        return { idx: idx, raw: raw, type: "skip" };
      }

      var keySuggestsText = TEXT_KEY_HINTS.test(normalizedKey);
      var keySuggestsTechnical = TECHNICAL_KEY_HINTS.test(normalizedKey);

      // Si la clave técnica indica un valor de sistema (material, sonido, permiso...) y el valor
      // es una sola palabra tipo identificador (sin espacios), no se traduce.
      var looksLikeBareIdentifier = /^[a-zA-Z0-9_\-./]+$/.test(text) && !/\s/.test(text);

      var shouldTranslate;
      if (keySuggestsText) {
        shouldTranslate = true; // confiar en la clave: mensajes, nombres, lore, etc.
      } else if (keySuggestsTechnical && looksLikeBareIdentifier) {
        shouldTranslate = false; // material/permiso/comando de una palabra: no traducir
      } else {
        // Clave ambigua: traducir salvo que sea un identificador de una sola palabra en minúsculas
        // muy corto sin ninguna señal de idioma natural (evita falsos positivos de rutas/slugs).
        shouldTranslate = !looksLikeBareIdentifier || text.length >= 3;
      }

      if (!shouldTranslate) {
        return { idx: idx, raw: raw, type: "skip" };
      }

      return { idx: idx, raw: raw, type: "translate", indent: indent, dash: dash, key: key, sp: sp, quote: quote, text: text, comment: comment };
    });
  }

  function protectPlaceholders(text) {
    var map = [];
    var protectedText = text;
    PLACEHOLDER_PATTERNS.forEach(function (pattern) {
      protectedText = protectedText.replace(pattern, function (match) {
        var token = "\u27E6P" + map.length + "\u27E7";
        map.push(match);
        return token;
      });
    });
    return { protectedText: protectedText, map: map };
  }

  function restorePlaceholders(text, map) {
    var restored = text;
    map.forEach(function (original, i) {
      var token = "\u27E6P" + i + "\u27E7";
      restored = restored.split(token).join(original);
    });
    return restored;
  }

  function rebuildLine(rec, translatedText) {
    var q = rec.quote;
    var value = q ? (q + translatedText + q) : translatedText;
    var commentPart = rec.comment ? (" " + rec.comment) : "";
    return rec.indent + rec.dash + rec.key + ":" + (rec.sp || " ") + value + commentPart;
  }

  // ---- Glosario local (localStorage) ----
  var GLOSSARY_KEY = "yml_translator_glossary_v1";

  function normalizeKey(s) {
    return s.trim().toLowerCase().replace(/\s+/g, " ");
  }

  function loadGlossary() {
    try {
      var raw = localStorage.getItem(GLOSSARY_KEY);
      if (!raw) return {};
      return JSON.parse(raw);
    } catch (e) {
      return {};
    }
  }

  function saveGlossary(glossary) {
    try {
      localStorage.setItem(GLOSSARY_KEY, JSON.stringify(glossary));
    } catch (e) {}
  }

  // glossary shape: { "<targetLangCode>": { "normalized protected text": "translated text" } }
  function glossaryLookup(glossary, langCode, protectedText) {
    var bucket = glossary[langCode];
    if (!bucket) return null;
    var norm = normalizeKey(protectedText);
    if (bucket[norm] !== undefined) return bucket[norm];
    return null;
  }

  function glossarySet(glossary, langCode, protectedText, translated) {
    if (!glossary[langCode]) glossary[langCode] = {};
    glossary[langCode][normalizeKey(protectedText)] = translated;
  }

  // ---- Motor de traducción automática gratuito (sin API key) ----
  // Varios proveedores en cascada: si uno falla (CORS, caído, rate-limit) prueba el siguiente.
  function fetchWithTimeout(url, options, ms) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, ms || 10000);
    return fetch(url, Object.assign({}, options, { signal: controller.signal }))
      .finally(function () { clearTimeout(timer); });
  }

  // Provider 1: Google Translate (endpoint público no oficial, sin key, CORS abierto)
  function providerGoogle(text, targetLangCode) {
    var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=" +
      encodeURIComponent(targetLangCode) + "&dt=t&q=" + encodeURIComponent(text);
    return fetchWithTimeout(url, { method: "GET" }, 10000).then(function (response) {
      if (!response.ok) throw new Error("Google Translate → HTTP " + response.status);
      return response.json();
    }).then(function (data) {
      // data[0] is an array of [translatedChunk, originalChunk, ...] segments
      if (!data || !Array.isArray(data[0])) throw new Error("Google Translate → respuesta inesperada");
      var out = data[0].map(function (seg) { return seg[0]; }).join("");
      if (!out) throw new Error("Google Translate → traducción vacía");
      return out;
    });
  }

  // Provider 2: MyMemory (servicio público gratuito, sin key, CORS abierto)
  function providerMyMemory(text, targetLangCode) {
    var url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) +
      "&langpair=" + encodeURIComponent("auto|" + targetLangCode);
    return fetchWithTimeout(url, { method: "GET" }, 10000).then(function (response) {
      if (!response.ok) throw new Error("MyMemory → HTTP " + response.status);
      return response.json();
    }).then(function (data) {
      var out = data && data.responseData && data.responseData.translatedText;
      if (!out) throw new Error("MyMemory → respuesta inesperada");
      return out;
    });
  }

  // Provider 3: LibreTranslate (varias instancias públicas)
  var LIBRETRANSLATE_ENDPOINTS = [
    "https://libretranslate.com/translate",
    "https://translate.terraprint.co/translate",
    "https://libretranslate.de/translate",
  ];
  function providerLibreTranslate(text, targetLangCode, endpointIndex, lastError) {
    endpointIndex = endpointIndex || 0;
    if (endpointIndex >= LIBRETRANSLATE_ENDPOINTS.length) {
      return Promise.reject(lastError || new Error("LibreTranslate → todas las instancias fallaron."));
    }
    var url = LIBRETRANSLATE_ENDPOINTS[endpointIndex];
    return fetchWithTimeout(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ q: text, source: "auto", target: targetLangCode, format: "text" }),
    }, 10000).then(function (response) {
      if (!response.ok) throw new Error(url + " → HTTP " + response.status);
      return response.json();
    }).then(function (data) {
      if (!data || typeof data.translatedText !== "string") throw new Error(url + " → respuesta inesperada");
      return data.translatedText;
    }).catch(function (err) {
      var msg = (err && err.name === "AbortError") ? new Error(url + " → tiempo de espera agotado") : err;
      return providerLibreTranslate(text, targetLangCode, endpointIndex + 1, msg);
    });
  }

  var PROVIDERS = [
    { name: "Google Translate", fn: providerGoogle },
    { name: "MyMemory", fn: providerMyMemory },
    { name: "LibreTranslate", fn: providerLibreTranslate },
  ];

  function autoTranslateOne(text, targetLangCode, providerIndex, lastError) {
    providerIndex = providerIndex || 0;
    if (providerIndex >= PROVIDERS.length) {
      return Promise.reject(lastError || new Error("Todos los proveedores de traducción fallaron."));
    }
    var provider = PROVIDERS[providerIndex];
    return provider.fn(text, targetLangCode).catch(function (err) {
      var msg = (err && err.name === "AbortError")
        ? new Error(provider.name + " → tiempo de espera agotado")
        : (err instanceof Error ? err : new Error(provider.name + " → " + String(err)));
      return autoTranslateOne(text, targetLangCode, providerIndex + 1, msg);
    });
  }

  function chunk(arr, size) {
    var out = [];
    for (var i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }

  // items: [{id, protectedText, map, rec}]
  // returns Promise<{ [id]: { text, source, error? } }>  source: "glossary" | "auto" | "error"
  function translateBatch(items, targetLangCode, glossary, onOne) {
    var results = {};
    var pending = [];
    var lastErrorMsg = null;

    items.forEach(function (it) {
      var hit = glossaryLookup(glossary, targetLangCode, it.protectedText);
      if (hit !== null) {
        results[it.id] = { text: hit, source: "glossary" };
        if (onOne) onOne();
      } else {
        pending.push(it);
      }
    });

    var chain = Promise.resolve();
    pending.forEach(function (it) {
      chain = chain.then(function () {
        return autoTranslateOne(it.protectedText, targetLangCode).then(function (translated) {
          results[it.id] = { text: translated, source: "auto" };
          if (onOne) onOne();
        }).catch(function (err) {
          lastErrorMsg = err && err.message ? err.message : String(err);
          results[it.id] = { text: it.protectedText, source: "error" };
          if (onOne) onOne();
        });
      });
    });

    return chain.then(function () {
      results.__lastError = lastErrorMsg;
      return results;
    });
  }

  // ---- Icons (inline SVG via createElement) ----
