<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YML Translator — sapphi.dev style</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0B0D10;
      color: #E7E9EC;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    .font-sans { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .scrollbar-thin::-webkit-scrollbar { width: 8px; height: 8px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #2A2E35; border-radius: 8px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    @keyframes pulse-bar { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    .pulse-bar { animation: pulse-bar 1.4s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useCallback, useEffect } = React;

    const LucideIcon = ({ name, size = 16, className = "", strokeWidth = 2 }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = `<i data-lucide="${name}" style="width: ${size}px; height: ${size}px; stroke-width: ${strokeWidth}; display: inline-block;"></i>`;
          window.lucide.createIcons({
            attrs: {
              class: className
            },
            nameAttr: 'data-lucide'
          });
        }
      }, [name, size, className, strokeWidth]);
      return <span ref={ref} className="inline-flex items-center justify-center" />;
    };

    const LANGS = [
      { code: "en", label: "Inglés" },
      { code: "es", label: "Español" },
      { code: "pt", label: "Portugués" },
      { code: "fr", label: "Francés" },
      { code: "de", label: "Alemán" },
      { code: "it", label: "Italiano" },
      { code: "ru", label: "Ruso" },
      { code: "zh", label: "Chino" },
    ];

    const PLACEHOLDER_PATTERNS = [
      /%[a-zA-Z0-9_\-]+%/g,                 // %player% PlaceholderAPI
      /\{[a-zA-Z0-9_\-]+\}/g,               // {player}
      /\{\{[a-zA-Z0-9_\-]+\}\}/g,           // {{player}}
      /&[0-9a-fk-orA-FK-OR]/g,              // legacy color codes &a &l
      /§[0-9a-fk-orA-FK-OR]/g,              // § color codes
      /<[a-zA-Z0-9_#:\/=,. \-]+>/g,         // MiniMessage tags <gradient:...> <red> </red>
      /minecraft:[a-z0-9_.]+/g,             // namespaced ids
      /\b[A-Z][A-Z0-9_]{2,}\b/g,            // MATERIAL_NAMES / CONSTANT_KEYS
      /%%/g,
    ];

    function splitKeyValue(line) {
      const m = line.match(/^(\s*)(-\s+)?([^:#][^:]*?)(:)(\s*)(.*)$/);
      if (!m) return null;
      const [, indent, dash, key, colon, sp, rest] = m;
      return { indent, dash: dash || "", key, colon, sp, rest };
    }

    function extractInlineComment(value) {
      let inQuote = null;
      for (let i = 0; i < value.length; i++) {
        const c = value[i];
        if (inQuote) {
          if (c === inQuote) inQuote = null;
        } else if (c === '"' || c === "'") {
          inQuote = c;
        } else if (c === "#" && (i === 0 || value[i - 1] === " ")) {
          return { val: value.slice(0, i).trimEnd(), comment: value.slice(i) };
        }
      }
      return { val: value, comment: "" };
    }

    function stripQuotes(v) {
      const trimmed = v.trim();
      if (
        (trimmed.startsWith('"') && trimmed.endsWith('"')) ||
        (trimmed.startsWith("'") && trimmed.endsWith("'"))
      ) {
        return { quote: trimmed[0], text: trimmed.slice(1, -1) };
      }
      return { quote: "", text: trimmed };
    }

    function parseLines(content) {
      const lines = content.split(/\r\n|\n/);
      return lines.map((raw, idx) => {
        if (/^\s*#/.test(raw) || raw.trim() === "") {
          return { idx, raw, type: "skip" };
        }
        const kv = splitKeyValue(raw);
        if (!kv) return { idx, raw, type: "skip" };
        const { indent, dash, key, sp, rest } = kv;

        if (rest.trim() === "" || rest.trim() === "|" || rest.trim() === ">" || rest.trim() === "|-" || rest.trim() === ">-") {
          return { idx, raw, type: "skip" };
        }

        const { val, comment } = extractInlineComment(rest);
        const { quote, text } = stripQuotes(val);

        const skipValue =
          text === "" ||
          /^(true|false|null|yes|no)$/i.test(text) ||
          /^-?\d+(\.\d+)?$/.test(text) ||
          /^\[.*\]$/.test(text) ||
          /^\{.*\}$/.test(text) ||
          /^[A-Z0-9_]+$/.test(text) ||
          /^minecraft:[a-z0-9_.]+$/.test(text);

        const looksTranslatable =
          /[a-zA-ZÀ-ÿ]/.test(text) &&
          !/^[a-z0-9_\-./]+$/.test(text);

        if (skipValue || !looksTranslatable) {
          return { idx, raw, type: "skip" };
        }

        return {
          idx,
          raw,
          type: "translate",
          indent,
          dash,
          key,
          sp,
          quote,
          text,
          comment,
        };
      });
    }

    function protectPlaceholders(text) {
      const map = [];
      let protectedText = text;
      PLACEHOLDER_PATTERNS.forEach((pattern) => {
        protectedText = protectedText.replace(pattern, (match) => {
          const token = `⟦P${map.length}⟧`;
          map.push(match);
          return token;
        });
      });
      return { protectedText, map };
    }

    function restorePlaceholders(text, map) {
      let restored = text;
      map.forEach((original, i) => {
        const token = `⟦P${i}⟧`;
        restored = restored.split(token).join(original);
      });
      return restored;
    }

    function rebuildLine(rec, translatedText) {
      const q = rec.quote;
      const value = q ? `${q}${translatedText}${q}` : translatedText;
      const commentPart = rec.comment ? ` ${rec.comment}` : "";
      return `${rec.indent}${rec.dash}${rec.key}:${rec.sp || " "}${value}${commentPart}`;
    }

    async function callClaude(systemPrompt, userPrompt) {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 4096,
          system: systemPrompt,
          messages: [{ role: "user", content: userPrompt }],
        }),
      });
      if (!response.ok) throw new Error(`API error ${response.status}`);
      const data = await response.json();
      const textBlock = data.content.find((b) => b.type === "text");
      return textBlock ? textBlock.text : "";
    }

    const BATCH_SIZE = 40;

    function chunk(arr, size) {
      const out = [];
      for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
      return out;
    }

    async function translateBatch(items, targetLangLabel) {
      const payload = items.map((it) => ({ id: it.id, text: it.protectedText }));
      const system = `Eres un traductor técnico especializado en archivos de configuración YAML para plugins de servidores de Minecraft (Paper/Spigot). Traduces ÚNICAMENTE el texto visible para el jugador (mensajes, lore, nombres, descripciones).

REGLAS ESTRICTAS:
1. Traduce SIEMPRE al idioma solicitado: ${targetLangLabel}.
2. NUNCA traduzcas ni modifiques tokens con la forma ⟦P0⟧, ⟦P1⟧, ⟦P2⟧, etc. Cópialos EXACTAMENTE tal cual, en la misma posición relativa que tendrían en una traducción natural.
3. No agregues comillas, dos puntos, ni cambies puntuación estructural.
4. Conserva emojis y saltos de línea "\n" literales si existen en el texto.
5. Mantén el tono y formato (mayúsculas iniciales, signos de exclamación, etc.) equivalente al original.
6. Responde ÚNICAMENTE con un JSON array válido, sin texto adicional, sin markdown, con este formato exacto:
[{"id": "0", "text": "traducción"}, {"id": "1", "text": "traducción"}]
El array debe tener exactamente los mismos "id" que la entrada, en cualquier orden.`;

      const user = `Traduce estos textos al ${targetLangLabel}:\n${JSON.stringify(payload, null, 2)}`;

      const raw = await callClaude(system, user);
      const clean = raw.replace(/```json|```/g, "").trim();
      let parsed;
      try {
        parsed = JSON.parse(clean);
      } catch (e) {
        const match = clean.match(/\[[\s\S]*\]/);
        parsed = match ? JSON.parse(match[0]) : [];
      }
      const map = {};
      parsed.forEach((p) => (map[String(p.id)] = p.text));
      return map;
    }

    function YmlTranslator() {
      const [mode, setMode] = useState("upload");
      const [fileName, setFileName] = useState("");
      const [rawContent, setRawContent] = useState("");
      const [pastedText, setPastedText] = useState("");
      const [targetLang, setTargetLang] = useState("es");
      const [langOpen, setLangOpen] = useState(false);
      const [status, setStatus] = useState("idle");
      const [progress, setProgress] = useState({ done: 0, total: 0 });
      const [outputContent, setOutputContent] = useState("");
      const [copied, setCopied] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");
      const [dragOver, setDragOver] = useState(false);
      const fileInputRef = useRef(null);

      const activeContent = mode === "upload" ? rawContent : pastedText;
      const langLabel = LANGS.find((l) => l.code === targetLang)?.label || targetLang;

      const handleFile = useCallback((file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          setRawContent(e.target.result);
          setFileName(file.name);
          setStatus("idle");
          setOutputContent("");
        };
        reader.readAsText(file);
      }, []);

      const onDrop = (e) => {
        e.preventDefault();
        setDragOver(false);
        const file = e.dataTransfer.files?.[0];
        handleFile(file);
      };

      const runTranslation = async () => {
        const content = activeContent;
        if (!content || !content.trim()) return;

        setStatus("translating");
        setErrorMsg("");
        setOutputContent("");

        try {
          const lineRecords = parseLines(content);
          const translatable = lineRecords.filter((r) => r.type === "translate");

          const items = translatable.map((rec, i) => {
            const { protectedText, map } = protectPlaceholders(rec.text);
            return { id: String(i), protectedText, map, rec };
          });

          setProgress({ done: 0, total: items.length });

          const batches = chunk(items, BATCH_SIZE);
          const resultMap = {};
          let doneCount = 0;

          for (const batch of batches) {
            const translated = await translateBatch(batch, langLabel);
            batch.forEach((it) => {
              const t = translated[it.id];
              resultMap[it.id] = t !== undefined ? restorePlaceholders(t, it.map) : it.rec.text;
            });
            doneCount += batch.length;
            setProgress({ done: doneCount, total: items.length });
          }

          let ptr = 0;
          const outLines = lineRecords.map((rec) => {
            if (rec.type === "skip") return rec.raw;
            const id = String(ptr);
            ptr++;
            const translatedText = resultMap[id] ?? rec.text;
            return rebuildLine(rec, translatedText);
          });

          setOutputContent(outLines.join("\n"));
          setStatus("done");
        } catch (err) {
          console.error(err);
          setErrorMsg("No se pudo completar la traducción. Intenta de nuevo.");
          setStatus("error");
        }
      };

      const handleCopy = async () => {
        if (!outputContent) return;
        await navigator.clipboard.writeText(outputContent);
        setCopied(true);
        setTimeout(() => setCopied(false), 1800);
      };

      const handleDownload = () => {
        if (!outputContent) return;
        const blob = new Blob([outputContent], { type: "text/yaml" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const base = fileName ? fileName.replace(/\.ya?ml$/i, "") : "config";
        a.href = url;
        a.download = `${base}_${targetLang}.yml`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const lineCount = activeContent ? activeContent.split(/\r\n|\n/).length : 0;

      return (
        <div className="min-h-screen bg-[#0B0D10] text-[#E7E9EC] font-sans">
          <div className="border-b border-[#1C1F24] bg-[#0E1013]">
            <div className="max-w-3xl mx-auto px-5 py-4 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-[#54DAF4] to-[#545EB6] flex items-center justify-center">
                  <LucideIcon name="file-text" size={16} strokeWidth={2.5} className="text-[#0B0D10]" />
                </div>
                <span className="font-semibold tracking-tight text-[15px]">YML Translate</span>
              </div>
              <div className="text-[12px] text-[#6B7078] font-mono">Paper · Bukkit · Spigot</div>
            </div>
          </div>

          <div className="max-w-3xl mx-auto px-5 py-8">
            <div className="mb-8">
              <h1 className="text-[26px] font-extrabold tracking-tight mb-2">Traductor de YML</h1>
              <p className="text-[#9296A0] text-[15px] leading-relaxed">
                Traduce archivos de configuración respetando claves, rutas, materiales y
                placeholders. Sube un archivo o pega el texto, elige el idioma y descarga el
                resultado.
              </p>
            </div>

            <div className="flex gap-2 mb-4">
              <button
                onClick={() => setMode("upload")}
                className={`flex-1 flex items-center justify-center gap-2 rounded-xl border px-4 py-3 text-[14px] font-medium transition-colors ${
                  mode === "upload"
                    ? "border-[#54DAF4]/50 bg-[#54DAF4]/10 text-[#7EE3F7]"
                    : "border-[#22262C] bg-[#111318] text-[#9296A0] hover:border-[#2E333A]"
                }`}
              >
                <LucideIcon name="upload" size={16} /> Subir archivo
              </button>
              <button
                onClick={() => setMode("paste")}
                className={`flex-1 flex items-center justify-center gap-2 rounded-xl border px-4 py-3 text-[14px] font-medium transition-colors ${
                  mode === "paste"
                    ? "border-[#54DAF4]/50 bg-[#54DAF4]/10 text-[#7EE3F7]"
                    : "border-[#22262C] bg-[#111318] text-[#9296A0] hover:border-[#2E333A]"
                }`}
              >
                <LucideIcon name="file-text" size={16} /> Pegar texto
              </button>
            </div>

            <div className="rounded-2xl border border-[#22262C] bg-[#111318] p-5 mb-4">
              {mode === "upload" ? (
                <>
                  <div className="flex items-center justify-between mb-3">
                    <span className="font-semibold text-[15px]">Archivo</span>
                    {fileName && (
                      <button
                        onClick={() => {
                          setRawContent("");
                          setFileName("");
                          setOutputContent("");
                          setStatus("idle");
                        }}
                        className="text-[#6B7078] hover:text-[#E7E9EC] transition-colors"
                      >
                        <LucideIcon name="x" size={16} />
                      </button>
                    )}
                  </div>
                  <input
                    ref={fileInputRef}
                    type="file"
                    accept=".yml,.yaml,text/yaml,text/plain"
                    className="hidden"
                    onChange={(e) => handleFile(e.target.files?.[0])}
                  />
                  <div
                    onClick={() => fileInputRef.current?.click()}
                    onDragOver={(e) => {
                      e.preventDefault();
                      setDragOver(true);
                    }}
                    onDragLeave={() => setDragOver(false)}
                    onDrop={onDrop}
                    className={`rounded-xl border-2 border-dashed px-6 py-10 text-center cursor-pointer transition-colors ${
                      dragOver
                        ? "border-[#54DAF4] bg-[#54DAF4]/5"
                        : "border-[#2A2E35] hover:border-[#3A3F47]"
                    }`}
                  >
                    {fileName ? (
                      <div>
                        <div className="w-10 h-10 mx-auto mb-3 rounded-lg bg-[#1B1E24] flex items-center justify-center">
                          <LucideIcon name="file-text" size={18} className="text-[#7EE3F7]" />
                        </div>
                        <p className="font-mono text-[13px] text-[#E7E9EC] mb-1">{fileName}</p>
                        <p className="text-[12px] text-[#6B7078]">{lineCount} líneas · toca para cambiar</p>
                      </div>
                    ) : (
                      <div>
                        <div className="w-10 h-10 mx-auto mb-3 rounded-lg bg-[#1B1E24] flex items-center justify-center">
                          <LucideIcon name="upload" size={18} className="text-[#6B7078]" />
                        </div>
                        <p className="text-[14px] text-[#9296A0] mb-1">
                          Arrastra tu archivo .yml aquí o toca para elegirlo
                        </p>
                        <p className="text-[12px] text-[#5A5F67]">config.yml, messages.yml, lang/es.yml...</p>
                      </div>
                    )}
                  </div>
                </>
              ) : (
                <>
                  <div className="flex items-center justify-between mb-3">
                    <span className="font-semibold text-[15px]">Contenido YML</span>
                    {pastedText && (
                      <button
                        onClick={() => {
                          setPastedText("");
                          setOutputContent("");
                          setStatus("idle");
                        }}
                        className="text-[#6B7078] hover:text-[#E7E9EC] transition-colors"
                      >
                        <LucideIcon name="x" size={16} />
                      </button>
                    )}
                  </div>
                  <textarea
                    value={pastedText}
                    onChange={(e) => {
                      setPastedText(e.target.value);
                      setOutputContent("");
                      setStatus("idle");
                    }}
                    placeholder={"welcome-message: '&aBienvenido %player%!'\nitem-name: '&6Espada Legendaria'\nmaterial: DIAMOND_SWORD"}
                    spellCheck={false}
                    className="w-full h-48 rounded-xl bg-[#0B0D10] border border-[#22262C] px-4 py-3 font-mono text-[13px] text-[#D6D9DE] placeholder-[#4A4F57] focus:outline-none focus:border-[#54DAF4]/50 resize-none scrollbar-thin"
                  />
                  <p className="text-[12px] text-[#5A5F67] mt-2">
                    {pastedText ? `${pastedText.split(/\r\n|\n/).length} líneas` : "Pega el contenido de tu archivo YML"}
                  </p>
                </>
              )}
            </div>

            <div className="rounded-2xl border border-[#22262C] bg-[#111318] p-5 mb-4">
              <span className="font-semibold text-[15px] block mb-3">Idioma de destino</span>
              <div className="relative">
                <button
                  onClick={() => setLangOpen(!langOpen)}
                  className="w-full flex items-center justify-between rounded-xl border border-[#22262C] bg-[#0B0D10] px-4 py-3 text-[14px] hover:border-[#2E333A] transition-colors"
                >
                  <span>{langLabel}</span>
                  <LucideIcon name="chevron-down" size={16} className={`text-[#6B7078] transition-transform ${langOpen ? "rotate-180" : ""}`} />
                </button>
                {langOpen && (
                  <div className="absolute z-10 mt-1.5 w-full rounded-xl border border-[#22262C] bg-[#15171C] shadow-xl overflow-hidden">
                    {LANGS.map((l) => (
                      <button
                        key={l.code}
                        onClick={() => {
                          setTargetLang(l.code);
                          setLangOpen(false);
                        }}
                        className={`w-full text-left px-4 py-2.5 text-[14px] hover:bg-[#1C1F24] transition-colors ${
                          l.code === targetLang ? "text-[#7EE3F7]" : "text-[#D6D9DE]"
                        }`}
                      >
                        {l.label}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </div>

            <button
              onClick={runTranslation}
              disabled={!activeContent?.trim() || status === "translating"}
              className="w-full flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-[#54DAF4] to-[#545EB6] text-[#0B0D10] font-semibold text-[15px] py-3.5 mb-6 transition-opacity disabled:opacity-30 disabled:cursor-not-allowed hover:opacity-90"
            >
              {status === "translating" ? (
                <>
                  <LucideIcon name="loader-2" size={18} className="animate-spin" />
                  Traduciendo {progress.done}/{progress.total}...
                </>
              ) : (
                <>
                  Traducir archivo <LucideIcon name="arrow-right" size={16} />
                </>
              )}
            </button>

            {status === "translating" && progress.total > 0 && (
              <div className="mb-6 -mt-4">
                <div className="h-1.5 rounded-full bg-[#1C1F24] overflow-hidden">
                  <div
                    className="h-full bg-gradient-to-r from-[#54DAF4] to-[#545EB6] pulse-bar"
                    style={{ width: `${Math.max(6, (progress.done / progress.total) * 100)}%`, transition: "width 0.3s ease" }}
                  />
                </div>
              </div>
            )}

            {status === "error" && (
              <div className="mb-6 rounded-xl border border-[#F45B5B]/30 bg-[#F45B5B]/10 px-4 py-3 text-[13px] text-[#FF8A8A]">
                {errorMsg}
              </div>
            )}

            {outputContent && (
              <div className="rounded-2xl border border-[#22262C] bg-[#111318] p-5">
                <div className="flex items-center justify-between mb-3">
                  <div>
                    <span className="font-semibold text-[15px] block">Resultado</span>
                    <span className="text-[12px] text-[#6B7078]">Traducido a {langLabel}</span>
                  </div>
                  <div className="flex gap-2">
                    <button
                      onClick={handleCopy}
                      className="flex items-center gap-1.5 rounded-lg border border-[#22262C] bg-[#0B0D10] px-3 py-2 text-[13px] text-[#D6D9DE] hover:border-[#2E333A] transition-colors"
                    >
                      {copied ? <LucideIcon name="check" size={14} className="text-[#7EE3F7]" /> : <LucideIcon name="copy" size={14} />}
                      {copied ? "Copiado" : "Copiar"}
                    </button>
                    <button
                      onClick={handleDownload}
                      className="flex items-center gap-1.5 rounded-lg bg-gradient-to-r from-[#54DAF4] to-[#545EB6] text-[#0B0D10] px-3 py-2 text-[13px] font-semibold hover:opacity-90 transition-opacity"
                    >
                      <LucideIcon name="download" size={14} />
                      Descargar
                    </button>
                  </div>
                </div>
                <pre className="rounded-xl bg-[#0B0D10] border border-[#22262C] px-4 py-3 font-mono text-[12.5px] text-[#D6D9DE] overflow-auto max-h-96 scrollbar-thin whitespace-pre-wrap break-words">
{outputContent}
                </pre>
              </div>
            )}

            <p className="text-[11px] text-[#4A4F57] text-center mt-8 leading-relaxed">
              Las claves, rutas, materiales, IDs de Minecraft y placeholders (%player%, {"{value}"}, &a, etiquetas MiniMessage)
              no se traducen y se preservan exactamente igual.
            </p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<YmlTranslator />);
  </script>
</body>
</html>
